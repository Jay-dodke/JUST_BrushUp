<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JavaScript Array Methods</title>
    <link rel="stylesheet" href="ArrayMethods.css" />
    <script src="ArrayMethods.js" defer></script>
  </head>
  <body>
    <main class="page">
      <header class="hero">
        <span class="badge">Learn Only</span>
        <h1>JavaScript Array Methods</h1>
        <p>Use methods to update a student task list quickly.</p>
      </header>

      <section class="card">
        <h2>Friendly Example</h2>
        <pre><code>
const tasks = ["Math Homework", "Science Project"];
tasks.push("English Reading");
tasks.shift();
const text = tasks.join(" | ");
        </code></pre>
        <div class="actions">
          <button id="run-btn" type="button">Run example</button>
          <p id="output" class="output">Click the button.</p>
        </div>
      </section>
    </main>
  </body>
</html>
