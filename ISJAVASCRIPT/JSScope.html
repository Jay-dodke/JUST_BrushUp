        <h1>JS Scope</h1>
        <p>Scope decides where a variable can be accessed.</p>

        <pre><code>
let city = "Delhi"; // global scope

function showCity() {
  let school = "ABC School"; // function scope
  return `${city} - ${school}`;
}
        </code></pre>
