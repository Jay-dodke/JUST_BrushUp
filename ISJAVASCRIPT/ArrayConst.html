<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JavaScript Array Const</title>
    <link rel="stylesheet" href="ArrayConst.css" />
    <script src="ArrayConst.js" defer></script>
  </head>
  <body>
    <main class="page">
      <header class="hero">
        <span class="badge">Learn Only</span>
        <h1>JavaScript Array Const</h1>
        <p>Use const safely with a fruit basket example.</p>
      </header>

      <section class="card">
        <h2>Friendly Example</h2>
        <pre><code>
const basket = ["Apple", "Banana"];
basket.push("Mango"); // allowed
basket[0] = "Orange"; // allowed

// basket = ["Kiwi"]; // not allowed
        </code></pre>
        <div class="actions">
          <button id="run-btn" type="button">Run example</button>
          <p id="output" class="output">Click the button.</p>
        </div>
      </section>
    </main>
  </body>
</html>
