<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JavaScript Array Search</title>
    <link rel="stylesheet" href="ArraySearch.css" />
    <script src="ArraySearch.js" defer></script>
  </head>
  <body>
    <main class="page">
      <header class="hero">
        <span class="badge">Learn Only</span>
        <h1>JavaScript Array Search</h1>
        <p>Find a contact name quickly from a phone list.</p>
      </header>

      <section class="card">
        <h2>Friendly Example</h2>
        <pre><code>
const contacts = ["Aman", "Riya", "Neha", "Karan"];
const hasRiya = contacts.includes("Riya");
const indexNeha = contacts.indexOf("Neha");
        </code></pre>
        <div class="actions">
          <button id="run-btn" type="button">Run example</button>
          <p id="output" class="output">Click the button.</p>
        </div>
      </section>
    </main>
  </body>
</html>
