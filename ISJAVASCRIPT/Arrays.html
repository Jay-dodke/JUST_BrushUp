<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JavaScript Arrays</title>
    <link rel="stylesheet" href="Arrays.css" />
    <script src="Arrays.js" defer></script>
  </head>
  <body>
    <main class="page">
      <header class="hero">
        <span class="badge">Learn Only</span>
        <h1>JavaScript Arrays</h1>
        <p>Learn arrays with a simple grocery list example.</p>
      </header>

      <section class="card">
        <h2>Friendly Example</h2>
        <pre><code>
const groceries = ["Milk", "Bread", "Eggs", "Apples"];
const firstItem = groceries[0];
const totalItems = groceries.length;
        </code></pre>
        <div class="actions">
          <button id="run-btn" type="button">Run example</button>
          <p id="output" class="output">Click the button.</p>
        </div>
      </section>
    </main>
  </body>
</html>
