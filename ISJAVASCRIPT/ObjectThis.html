<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Object This</title>
    <link rel="stylesheet" href="ObjectThis.css" />
    <script src="ObjectThis.js" defer></script>
  </head>
  <body>
    <header class="hero">
      <h1>JavaScript Object this</h1>
      <p>`this` refers to the current object in a method.</p>
    </header>
    <main class="content">
      <section class="card">
        <h2>this Keyword</h2>
        <pre><code>
const car = {
  brand: "Tata",
  model: "Nexon",
  info() {
    return `${this.brand} ${this.model}`;
  }
};
        </code></pre>
        <button id="run-btn" type="button">Run example</button>
        <p id="output" class="output">Click the button.</p>
      </section>
    </main>
  </body>
</html>
