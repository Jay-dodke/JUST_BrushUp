<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Function Invocation</title>
    <link rel="stylesheet" href="FunctionInvocation.css" />
    <script src="FunctionInvocation.js" defer></script>
  </head>
  <body>
    <header class="hero">
      <h1>Function Invocation</h1>
      <p>Invocation means calling a function using parentheses: <code>myFn()</code></p>
    </header>
    <main class="content">
      <section class="card">
        <h2>Example</h2>
        <pre><code>
function markAttendance() {
  return "Attendance marked";
}

markAttendance();
        </code></pre>
        <button id="run-btn" type="button">Invoke function</button>
        <p id="output" class="output">Click the button.</p>
      </section>
    </main>
  </body>
</html>
