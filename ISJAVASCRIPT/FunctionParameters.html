<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Function Parameters</title>
    <link rel="stylesheet" href="FunctionParameters.css" />
    <script src="FunctionParameters.js" defer></script>
  </head>
  <body>
    <header class="hero">
      <h1>Function Parameters</h1>
      <p>Parameters are input names defined in function declaration.</p>
    </header>
    <main class="content">
      <section class="card">
        <h2>Student Example</h2>
        <pre><code>
function studentFunction(name, marks) {
  return `${name} scored ${marks}`;
}
        </code></pre>
        <button id="run-btn" type="button">Run parameters</button>
        <p id="output" class="output">Click the button.</p>
      </section>
    </main>
  </body>
</html>
