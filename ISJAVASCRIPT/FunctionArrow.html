<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Function Arrow</title>
    <link rel="stylesheet" href="FunctionArrow.css" />
    <script src="FunctionArrow.js" defer></script>
  </head>
  <body>
    <header class="hero">
      <h1>Arrow Function</h1>
      <p>Short syntax using <code>=&gt;</code></p>
    </header>
    <main class="content">
      <section class="card">
        <h2>Example</h2>
        <pre><code>
const studentPass = (marks) =&gt; marks >= 35;
        </code></pre>
        <button id="run-btn" type="button">Run arrow</button>
        <p id="output" class="output">Click the button.</p>
      </section>
    </main>
  </body>
</html>
