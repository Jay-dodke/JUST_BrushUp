<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Flexbox Justify-Content</title>
    <link rel="stylesheet" href="FlexboxJustifyContent.css" />
  </head>
  <body>
    <main class="page">
      <header class="intro">
        <h1>Flexbox justify-content</h1>
        <p>
          Align items along the main axis. Compare the most common values side
          by side.
        </p>
      </header>

      <section class="example">
        <h2>flex-start (default)</h2>
        <div class="flex-container start">
          <div class="item">A</div>
          <div class="item">B</div>
          <div class="item">C</div>
        </div>
      </section>

      <section class="example">
        <h2>center</h2>
        <div class="flex-container center">
          <div class="item">A</div>
          <div class="item">B</div>
          <div class="item">C</div>
        </div>
      </section>

      <section class="example">
        <h2>flex-end</h2>
        <div class="flex-container end">
          <div class="item">A</div>
          <div class="item">B</div>
          <div class="item">C</div>
        </div>
      </section>

      <section class="example">
        <h2>space-between</h2>
        <div class="flex-container between">
          <div class="item">A</div>
          <div class="item">B</div>
          <div class="item">C</div>
        </div>
      </section>

      <section class="example">
        <h2>space-around</h2>
        <div class="flex-container around">
          <div class="item">A</div>
          <div class="item">B</div>
          <div class="item">C</div>
        </div>
      </section>

      <section class="example">
        <h2>space-evenly</h2>
        <div class="flex-container evenly">
          <div class="item">A</div>
          <div class="item">B</div>
          <div class="item">C</div>
        </div>
      </section>
    </main>
  </body>
</html>
