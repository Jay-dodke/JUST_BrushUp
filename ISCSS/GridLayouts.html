<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CSS Grid Layouts</title>
  <link rel="stylesheet" href="GridLayouts.css" />
</head>
<body>
  <main class="page">
    <header class="intro">
      <h1>CSS Grid Layouts</h1>
      <p>A simple page layout using grid areas for header, nav, content, sidebar, and footer.</p>
    </header>

    <section class="grid">
      <header class="box header">Header</header>
      <nav class="box nav">Nav</nav>
      <article class="box main">Main Content</article>
      <aside class="box sidebar">Sidebar</aside>
      <footer class="box footer">Footer</footer>
    </section>
  </main>
</body>
</html>
