<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Flexbox Image Gallery</title>
    <link rel="stylesheet" href="FlexboxResponsive.css" />
  </head>
  <body>
    <main class="page">
      <header class="intro">
        <h1>Flexbox Gallery</h1>
        <p>
          Flexbox + media queries create 4-column, 2-column, and 1-column
          layouts.
        </p>
      </header>

      <section class="gallery" aria-label="Photo gallery">
        <figure class="card">
          <img
            src="https://picsum.photos/id/1015/600/400"
            alt="Mountain lake" />
          <figcaption>Mountain Lake</figcaption>
        </figure>
        <figure class="card">
          <img src="https://picsum.photos/id/1025/600/400" alt="Playful dog" />
          <figcaption>Playful Dog</figcaption>
        </figure>
        <figure class="card">
          <img src="https://picsum.photos/id/1039/600/400" alt="Forest trail" />
          <figcaption>Forest Trail</figcaption>
        </figure>
        <figure class="card">
          <img
            src="https://picsum.photos/id/1043/600/400"
            alt="Coastal rocks" />
          <figcaption>Coastal Rocks</figcaption>
        </figure>
        <figure class="card">
          <img src="https://picsum.photos/id/1050/600/400" alt="Snowy ridge" />
          <figcaption>Snowy Ridge</figcaption>
        </figure>
        <figure class="card">
          <img src="https://picsum.photos/id/1062/600/400" alt="Desert road" />
          <figcaption>Desert Road</figcaption>
        </figure>
        <figure class="card">
          <img src="https://picsum.photos/id/1074/600/400" alt="City skyline" />
          <figcaption>City Skyline</figcaption>
        </figure>
      </section>
    </main>
  </body>
</html>
