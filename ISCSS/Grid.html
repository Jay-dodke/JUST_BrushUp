<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Grid: Container, Tracks, Gap, Align</title>
  <link rel="stylesheet" href="Grid.css" />
</head>
<body>
  <main class="page">
    <header class="intro">
      <h1>Grid</h1>
      <p>Grid container + tracks + gap + alignment in one clean example.</p>
    </header>

    <section class="grid" aria-label="Card grid">
      <article class="card featured">
        <img src="https://picsum.photos/id/1011/800/500" alt="Mountain landscape" />
        <div class="card-body">
          <h2>Featured</h2>
          <p>Wide card spanning two columns.</p>
        </div>
      </article>
      <article class="card">
        <img src="https://picsum.photos/id/1027/600/400" alt="Dog portrait" />
        <div class="card-body">
          <h2>Portrait</h2>
          <p>Standard grid card.</p>
        </div>
      </article>
      <article class="card">
        <img src="https://picsum.photos/id/1035/600/400" alt="Forest path" />
        <div class="card-body">
          <h2>Forest</h2>
          <p>Standard grid card.</p>
        </div>
      </article>
      <article class="card">
        <img src="https://picsum.photos/id/1040/600/400" alt="Ocean coast" />
        <div class="card-body">
          <h2>Coast</h2>
          <p>Standard grid card.</p>
        </div>
      </article>
      <article class="card">
        <img src="https://picsum.photos/id/1060/600/400" alt="Desert road" />
        <div class="card-body">
          <h2>Desert</h2>
          <p>Standard grid card.</p>
        </div>
      </article>
      <article class="card tall">
        <img src="https://picsum.photos/id/1077/600/700" alt="City skyline" />
        <div class="card-body">
          <h2>City</h2>
          <p>Taller card to show row sizing.</p>
        </div>
      </article>
    </section>
  </main>
</body>
</html>
