<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Z-Index</title>
    <link rel="stylesheet" href="ZIndax.css" />
  </head>
  <body>
    <h1>CSS Z-Index</h1>
    <p class="intro">
      Z-index controls which positioned element appears on top.
    </p>

    <section class="panel">
      <h2>Stacking Order</h2>
      <p class="note">
        Z-index works only on positioned elements (not static).
      </p>
      <div class="stage">
        <div class="box one">z-index: 1</div>
        <div class="box two">z-index: 2</div>
        <div class="box three">z-index: 3</div>
      </div>
    </section>

    <section class="panel">
      <h2>Example: Card Badge</h2>
      <p class="note">
        The badge sits above the card using a higher z-index.
      </p>
      <div class="card">
        <div class="badge">Top</div>
        <p>Content inside the card</p>
      </div>
    </section>
  </body>
</html>
