<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>supports Rule</title>
    <link rel="stylesheet" href="SupportRule.css" />
  </head>
  <body>
    <main class="page">
      <header class="intro">
        <h1>supports Rule</h1>
        <p>
          Use feature queries to apply styles only when the browser supports
          them.
        </p>
      </header>

      <section class="card">
        <h2>Layout Example</h2>
        <p>
          This layout uses CSS Grid if supported. If not, it falls back to
          Flexbox.
        </p>
        <div class="layout">
          <div class="box">Alpha</div>
          <div class="box">Beta</div>
          <div class="box">Gamma</div>
        </div>
      </section>
    </main>
  </body>
</html>
