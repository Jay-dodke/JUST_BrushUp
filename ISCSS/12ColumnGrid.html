<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>12-Column CSS Grid</title>
  <link rel="stylesheet" href="12ColumnGrid.css" />
</head>
<body>
  <main class="page">
    <header class="intro">
      <h1>12-Column Grid</h1>
      <p>A simple 12-column layout with content spanning multiple columns.</p>
    </header>

    <section class="grid">
      <div class="box span-12">Header (span 12)</div>
      <div class="box span-3">Nav (span 3)</div>
      <div class="box span-6">Main (span 6)</div>
      <div class="box span-3">Aside (span 3)</div>
      <div class="box span-4">Card (span 4)</div>
      <div class="box span-4">Card (span 4)</div>
      <div class="box span-4">Card (span 4)</div>
      <div class="box span-12">Footer (span 12)</div>
    </section>
  </main>
</body>
</html>
