<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Flexbox Justify-Content Example</title>
  <link rel="stylesheet" href="FlexBoxContainer.css" />
</head>
<body>
  <main class="page">
    <header class="hero">
      <h1>justify-content in a Flex Container</h1>
      <p>See how flex items align along the main axis with different values.</p>
    </header>

    <section class="example">
      <h2>flex-start (default)</h2>
      <div class="flex-container start">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
      </div>
    </section>

    <section class="example">
      <h2>center</h2>
      <div class="flex-container center">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
      </div>
    </section>

    <section class="example">
      <h2>flex-end</h2>
      <div class="flex-container end">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
      </div>
    </section>

    <section class="example">
      <h2>space-between</h2>
      <div class="flex-container between">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
      </div>
    </section>

    <section class="example">
      <h2>space-around</h2>
      <div class="flex-container around">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
      </div>
    </section>

    <section class="example">
      <h2>space-evenly</h2>
      <div class="flex-container evenly">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
      </div>
    </section>
  </main>
</body>
</html>
